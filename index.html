.action{display:inline-block;margin-top:12px;padding:12px 20px;border-radius:28px;background:linear-gradient(90deg,#c49b28,#ffe27b);color:#111!important;font-weight:800;text-decoration:none}

<h2 id="modal-title">Política de privacidad</h2>
<p>MOVÍ utiliza la información que el usuario proporciona al crear su cuenta y al usar la aplicación, como registros de ingresos, gastos, kilómetros, metas, país, moneda y plataformas seleccionadas.</p>

<p class="note">Este texto es una base informativa. Antes de publicarlo como política definitiva, debe revisarse y completarse con la identidad y datos legales del responsable del tratamiento.</p>

<h3>Soporte</h3>
<p>Para consultas sobre el servicio, contacta al equipo de MOVÍ.</p>

`,

ayuda:`
<h2 id="modal-title">¿Necesitas ayuda?</h2>

<a class="action" href="${WA}" target="_blank" rel="noopener">Hablar con MOVÍ por WhatsApp</a>
`

};

function show(key){
if(!pages[key])return;
document.getElementById("modal-content").innerHTML=pages[key];
document.getElementById("modal").classList.add("open");
document.body.style.overflow="hidden";
}

function hide(){
document.getElementById("modal").classList.remove("open");
document.body.style.overflow="";
}

function outside(e){
if(e.target.id==="modal")hide();
}

function topPage(){
window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("keydown",e=>{
if(e.key==="Escape")hide();
});

</script>
